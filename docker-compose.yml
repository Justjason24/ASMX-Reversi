services:
  reversi-api:
    build: ./ReversiApi
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - CORS_ORIGINS=http://localhost,http://localhost:80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  angular-reversi:
    build: ./angular-reversi
    ports:
      - "80:80"
    depends_on:
      reversi-api:
        condition: service_healthy